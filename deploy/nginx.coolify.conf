# nginx config for the self-hosted (Coolify) stack.
# Same as frontend/nginx.conf, except /api is proxied to the internal
# "backend" compose service instead of the old public duckdns domain.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml application/xml+rss image/svg+xml;

    location /api/ {
        # Docker's embedded DNS; re-resolve so a backend restart (new IP) works
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend http://backend:5001;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
